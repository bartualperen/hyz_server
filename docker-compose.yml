services:
  teknofest-server:
    build: ./
    container_name: teknofest-local-server
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # SQLite (varsayılan, tek servis). Postgres'e geçmek için db servisini açın ve
      # DATABASE_URL=postgresql+psycopg://teknofest:teknofest@db:5432/teknofest yapın.
      - DATABASE_URL=sqlite:////app/data/app.db
      - PUBLIC_URL=https://saerotech.bartualperen.com/
      - MEDIA_ROOT=/app/data/media
      - AUTO_SEED=true
      - RATE_LIMIT_ENABLED=false
      - DEFAULT_TEAM_NAME=test_team
      - DEFAULT_TEAM_PASSWORD=test
    volumes:
      - ./data:/app/data
      - /mnt/hdd/SaerotechAI/DataSets:/datasets:ro
      # Harici diskteki gerçek datasetlerinizi buraya bağlayın; panelden bu yolu kaydedin.
      # - D:/teknofest-datasets:/datasets:ro

